# IBVAP frontend static runtime — SPA fallback. All dynamic traffic
# (/api, /socket.io) is handled by the gateway nginx, not this container.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}