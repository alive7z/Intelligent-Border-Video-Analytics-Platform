services:
  bop:
    build: .
    command: ["python", "ledger.py", "--node-id", "BOP", "--port", "8541", "--chain-id", "51201", "--token", "${LEDGER_NODE_TOKEN:-ibvap-ledger-demo-token}", "--peers", "sector-hq:8542,command-centre:8543"]
    environment:
      - LEDGER_NODE_TOKEN=${LEDGER_NODE_TOKEN:-ibvap-ledger-demo-token}
    ports:
      - "8541:8541"
    volumes:
      - bop-data:/ledger/data/BOP

  sector-hq:
    build: .
    command: ["python", "ledger.py", "--node-id", "Sector-HQ", "--port", "8542", "--chain-id", "51201", "--token", "${LEDGER_NODE_TOKEN:-ibvap-ledger-demo-token}", "--peers", "bop:8541,command-centre:8543"]
    environment:
      - LEDGER_NODE_TOKEN=${LEDGER_NODE_TOKEN:-ibvap-ledger-demo-token}
    ports:
      - "8542:8542"
    volumes:
      - sector-data:/ledger/data/Sector-HQ

  command-centre:
    build: .
    command: ["python", "ledger.py", "--node-id", "Command-Centre", "--port", "8543", "--chain-id", "51201", "--token", "${LEDGER_NODE_TOKEN:-ibvap-ledger-demo-token}", "--peers", "bop:8541,sector-hq:8542"]
    environment:
      - LEDGER_NODE_TOKEN=${LEDGER_NODE_TOKEN:-ibvap-ledger-demo-token}
    ports:
      - "8543:8543"
    volumes:
      - command-data:/ledger/data/Command-Centre

volumes:
  bop-data:
  sector-data:
  command-data: