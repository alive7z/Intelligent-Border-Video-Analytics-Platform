global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # IBVAP application endpoints currently expose JSON health data, not the
  # Prometheus exposition format. Do not scrape those endpoints as metrics.
  # Prometheus self-monitoring is enabled until a dedicated metrics endpoint
  # is implemented.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
